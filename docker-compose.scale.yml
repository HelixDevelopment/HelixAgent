  neo4j:
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEM_LIMIT:-8G}
          cpus: "${NEO4J_CPU_LIMIT:-4.00}"
        reservations:
          memory: ${NEO4J_MEM_RESERVE:-2G}
          cpus: "${NEO4J_CPU_RESERVE:-1.00}"

  cognee:
    deploy:
      resources:
        limits:
          memory: ${COGNEE_MEM_LIMIT:-8G}
          cpus: "${COGNEE_CPU_LIMIT:-4.00}"
        reservations:
