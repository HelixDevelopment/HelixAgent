<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="334px" preserveAspectRatio="none" style="width:520px;height:334px;background:#FFFFFF;" version="1.1" viewBox="0 0 520 334" width="520px" zoomAndPan="magnify"><title>VisionEngine Remote Pool Architecture</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="487.2979" x="15" y="35.4209">VisionEngine Remote Pool Architecture</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="264.9541" x="113.3555" y="70.6094">Dot Executable: /opt/local/bin/dot</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.2637" x="113.3555" y="86.9063">Dot executable does not exist</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="291.5869" x="113.3555" y="103.2031">Cannot find Graphviz. You should try</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="113.3555" y="119.5">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.4229" x="113.3555" y="135.7969">@startuml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="57.5449" x="113.3555" y="152.0938">testdot</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="72.8369" x="113.3555" y="168.3906">@enduml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="113.3555" y="184.6875">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="16.5225" x="118.2295" y="200.9844">or</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="113.3555" y="217.2813">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.5068" x="113.3555" y="233.5781">java -jar plantuml.jar -testdot</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="113.3555" y="249.875">&#160;</text><rect fill="none" height="58.8906" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="466.7021" x="25.2979" y="262.1719"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="456.7021" x="30.2979" y="280.167">VisionPool manages slot allocation across devices and platforms.</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.1748" x="30.2979" y="296.4639">Semaphores prevent GPU oversubscription.</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="396.5869" x="30.2979" y="312.7607">Metrics feed Prometheus / OpenTelemetry observability.</text><!--SRC=[VLLDSzCm4BtxLopbqWwDQPm2cHoOIKi_c6b9Iailm46HruucicGaEKs6uR-paktK8IbxYzxRrUvxA-ULcsE1K4ecL6GNGfNCi09Ip5WbtQLMxWiZ_1hb4ftWhCFXkYYrGkNEj4dHd6kf3Rn-5s8lZV55RdIbqePw6Q93BOd1SjogT_f-c9oTxY7jL3kv76vLOyRefmOSXEY0IhljUuOX_cNiQVdJnOSeSi99X4TXXLONAXSAuIiMb05JhIMC3PyBXznL1gEewHWEI4Mn6kUa1LnhwmxWTmGKt-_6C1KbWGf_0hDmDwxFw_g-OZX-d8PZtnZCj7Ew09srfpuyyrohJEIZpLalN3K2DnTgWIQMcZFPGM_PYb9uPGorDKLpBpMnamxZiygGG1xKG9MEG4fMi1ulomxhZ5cSQaEvmvFXIG286vgD_dGqQ6IwcdxRrc0IYeOv9pVrKNsDHRD40oDVDi0tz_qNy7w39o_WIOCFedr2jdLzN30-1qjIm9pPhfYtbSCLPBGBkEAoicA9m3X7QpkaUonOETS60v6tyl8rI548ros7pWXkuP1CaVOOd2Zm690srzYZ7H5fJtgzZ-GuZE0AdRVga5wkerkAOtgpIy7nA8e8zpIQXtYrdqobHejqH9p-3pNclof1tRsbfPL8nZsd9FjIal-c33OfJpZRnumcDn2t_HGwHGdU