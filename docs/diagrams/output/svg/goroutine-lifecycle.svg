1="5" x2="593.5127" y1="709.8008" y2="709.8008"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="593.5127" y1="712.8008" y2="712.8008"/><rect fill="#FFFFFF" height="23.1328" style="stroke:#000000;stroke-width:1;" width="195.5049" x="201.5039" y="699.2344"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="176.979" x="207.5039" y="715.3013">Phase 1 Safety Patterns</text><path d="M10,737.3672 L10,822.3672 L263,822.3672 L263,747.3672 L253,737.3672 L10,737.3672 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M253,737.3672 L253,747.3672 L263,747.3672 L253,737.3672 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.3984" x="16" y="754.4341">sync.Once Lazy Loading</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="232.3623" x="16" y="769.5669">Provider initialization via sync.Once</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="221.6348" x="16" y="784.6997">ensures goroutine-safe single init.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="186.1958" x="16" y="799.8325">Applied in: provider registry,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.7827" x="16" y="814.9653">MCP adapter pool, cache warming.</text><path d="M257,833.0313 L257,918.0313 L495,918.0313 L495,843.0313 L485,833.0313 L257,833.0313 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M485,833.0313 L485,843.0313 L495,843.0313 L485,833.0313 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.5254" x="263" y="850.0981">Circuit Breaker Cascade</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="205.937" x="263" y="865.231">Each provider goroutine checks</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="217.8071" x="263" y="880.3638">circuit breaker state before work.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="217.166" x="263" y="895.4966">Open breaker = early return with</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.7188" x="263" y="910.6294">fallback to next provider.</text><path d="M39,928.6953 L39,1028.6953 L488,1028.6953 L488,938.6953 L478,928.6953 L39,928.6953 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M478,928.6953 L478,938.6953 L488,938.6953 L478,928.6953 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="178.2866" x="146.459" y="945.7622">Resource Monitor Guard</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="193.6289" x="146.459" y="960.895">Background goroutines check</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="222.2568" x="146.459" y="976.0278">ResourceMonitor before spawning</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="205.7275" x="146.459" y="991.1606">new work. Prevents OOM under</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="215.9282" x="146.459" y="1006.2935">high concurrency (GOMAXPROCS</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.3926" x="146.459" y="1021.4263">limited to 30-40% host resources).</text><!--SRC=[RLHTRzj647pdhzYcA60Bjf3q0oWCg83Cf581gnAY0kb3NrR75NdG-OwzMqfM