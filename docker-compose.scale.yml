          cpus: "${LANGCHAIN_SERVER_CPU_LIMIT:-2.00}"
        reservations:
          memory: ${LANGCHAIN_SERVER_MEM_RESERVE:-1G}
          cpus: "${LANGCHAIN_SERVER_CPU_RESERVE:-0.50}"

  llamaindex-server:
    deploy:
      resources:
        limits:
          memory: ${LLAMAINDEX_SERVER_MEM_LIMIT:-4G}
          cpus: "${LLAMAINDEX_SERVER_CPU_LIMIT:-2.00}"
        reservations:
          memory: ${LLAMAINDEX_SERVER_MEM_RESERVE:-1G}
          cpus: "${LLAMAINDEX_SERVER_CPU_RESERVE:-0.50}"

  guidance-server:
    deploy:
      resources:
        limits:
          memory: ${GUIDANCE_SERVER_MEM_LIMIT:-4G}
          cpus: "${GUIDANCE_SERVER_CPU_LIMIT:-2.00}"
        reservations:
          memory: ${GUIDANCE_SERVER_MEM_RESERVE:-1G}
          cpus: "${GUIDANCE_SERVER_CPU_RESERVE:-0.50}"

  lmql-server:
    deploy:
      resources:
        limits:
          memory: ${LMQL_SERVER_MEM_LIMIT:-4G}
          cpus: "${LMQL_SERVER_CPU_LIMIT:-2.00}"
        reservations:
          memory: ${LMQL_SERVER_MEM_RESERVE:-1G}
          cpus: "${LMQL_SERVER_CPU_RESERVE:-0.50}"

  # --- Tier: Medium -> production ---
  postgres:
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-8G}
          cpus: "${POSTGRES_CPU_LIMIT:-4.00}"
        reservations:
          memory: ${POSTGRES_MEM_RESERVE:-2G}
          cpus: "${POSTGRES_CPU_RESERVE:-1.00}"

  chromadb:
    deploy:
      resources:
        limits:
          memory: ${CHROMADB_MEM_LIMIT:-8G}
          cpus: "${CHROMADB_CPU_LIMIT:-4.00}"
        reservations:
          memory: ${CHROMADB_MEM_RESERVE:-2G}
          cpus: "${CHROMADB_CPU_RESERVE:-1.00}"

  memgraph:
    deploy:
      resources:
