  sglang:
    deploy:
      resources:
        limits:
          memory: ${SGLANG_MEM_LIMIT:-8G}
          cpus: "${SGLANG_CPU_LIMIT:-4.00}"
        reservations:
          memory: ${SGLANG_MEM_RESERVE:-2G}
          cpus: "${SGLANG_CPU_RESERVE:-1.00}"
          # GPU device reservation inherited from base file via overlay merge.

  # --- Tier: XL (local LLM) -> production ---
  ollama:
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-24G}
          cpus: "${OLLAMA_CPU_LIMIT:-8.00}"
        reservations:
          memory: ${OLLAMA_MEM_RESERVE:-8G}
          cpus: "${OLLAMA_CPU_RESERVE:-2.00}"
