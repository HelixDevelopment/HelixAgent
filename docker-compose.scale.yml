# docker-compose.scale.yml — production scaling overlay.
#
# Layers on top of docker-compose.yml to bump every service to its
# production-tier resource budget. Pure env-var overrides — no structural
# changes — so the same base file works for dev, staging, and prod.
#
# Use:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# Each value is overridable per-environment. Set
# `<SERVICE_UPPER>_MEM_LIMIT` etc. in your shell or in Containers/.env to
# override. See docs/development/container-resource-policy.md for the full
# tier table and the rationale behind these numbers.
#
# Defaults below: ~2x dev for tiny/small services, +50–100% for medium
# databases, +50% RAM for ollama (the biggest consumer).

services:
  # --- Tier: Tiny -> production ---
  redis:
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-2G}
          cpus: "${REDIS_CPU_LIMIT:-1.00}"
        reservations:
          memory: ${REDIS_MEM_RESERVE:-512M}
          cpus: "${REDIS_CPU_RESERVE:-0.25}"

  grafana:
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-2G}
          cpus: "${GRAFANA_CPU_LIMIT:-1.00}"
        reservations:
          memory: ${GRAFANA_MEM_RESERVE:-512M}
          cpus: "${GRAFANA_CPU_RESERVE:-0.25}"

  mock-llm:
    deploy:
      resources:
        limits:
          memory: ${MOCK_LLM_MEM_LIMIT:-2G}
          cpus: "${MOCK_LLM_CPU_LIMIT:-1.00}"
        reservations:
          memory: ${MOCK_LLM_MEM_RESERVE:-512M}
          cpus: "${MOCK_LLM_CPU_RESERVE:-0.25}"

  # --- Tier: Small -> production ---
  prometheus:
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-4G}
          cpus: "${PROMETHEUS_CPU_LIMIT:-2.00}"
        reservations:
          memory: ${PROMETHEUS_MEM_RESERVE:-1G}
          cpus: "${PROMETHEUS_CPU_RESERVE:-0.50}"

  langchain-server:
