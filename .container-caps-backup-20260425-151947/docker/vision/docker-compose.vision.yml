# docker/vision/docker-compose.vision.yml
# Vision Analysis Service for HelixAgent
# Provides image analysis and computer vision capabilities via VisionEngine

version: '3.8'

services:
  vision:
    build:
      context: ../../VisionEngine
      dockerfile: Dockerfile.vision
    container_name: helixagent-vision
    ports:
      - "${VISION_PORT:-9330}:9330"
    environment:
      - VISION_PORT=9330
      - VISION_MODEL=${VISION_MODEL:-default}
      - VISION_MAX_IMAGE_SIZE=${VISION_MAX_IMAGE_SIZE:-10485760}
      - HELIXAGENT_URL=${HELIXAGENT_URL:-http://helixagent:7061}
    volumes:
      - vision_cache:/data/cache:rw
    networks:
      - helixagent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9330/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  vision_cache:
    driver: local

networks:
  helixagent-network:
    external: true
