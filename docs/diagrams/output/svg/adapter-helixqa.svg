<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="317px" preserveAspectRatio="none" style="width:537px;height:317px;background:#FFFFFF;" version="1.1" viewBox="0 0 537 317" width="537px" zoomAndPan="magnify"><title>HelixQA Adapter Integration</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="352.8701" x="90.6333" y="35.4209">HelixQA Adapter Integration</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="264.9541" x="121.7749" y="70.6094">Dot Executable: /opt/local/bin/dot</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.2637" x="121.7749" y="86.9063">Dot executable does not exist</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="291.5869" x="121.7749" y="103.2031">Cannot find Graphviz. You should try</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="121.7749" y="119.5">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.4229" x="121.7749" y="135.7969">@startuml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="57.5449" x="121.7749" y="152.0938">testdot</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="72.8369" x="121.7749" y="168.3906">@enduml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="121.7749" y="184.6875">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="16.5225" x="126.6489" y="200.9844">or</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="121.7749" y="217.2813">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.5068" x="121.7749" y="233.5781">java -jar plantuml.jar -testdot</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="121.7749" y="249.875">&#160;</text><rect fill="none" height="42.5938" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="514.1367" x="10" y="262.1719"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="504.1367" x="15" y="280.167">Adapter layer decouples HTTP concerns from HelixQA module internals.</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="474.4072" x="15" y="296.4639">VisionEngine slot lifecycle managed entirely within SessionPipeline.</text><!--SRC=[TLHDSnif4BtpAph99QwKDBkRZtNva2h5iQrKHV788_kosWCUMYCs34m0oL5I-Uzf690bMSiDteFkVlsQPtw9BKAdkDJCVPMwuvQt8731LyfV6ks_SCB7gDRePSrtEBLfEwDH-m_62hJdHXaBBzx6TPJ6ww-DDIij4lKohXrgHmpUuDvxRzwT_lNXpH7IazV-k3pTUurRQnuI-3gk7L0Rln_dDAv3nf6KFrxypPYNNaLLvFVf24Q2TnujVD8U6ykzD9gnb2Sy7yzc9Npc6xJFuIS3MlzCHsEkXKBxBt07qt4y3G7XtdXlMZ2BV1fMULtDe5Z_MNpZXKFdw7st1QykPf31XTH2wkOHB6-VWiMP54TlamdymjZM7GqifAlD6cq4KOkOB_krKsYMOR_M0v5YnUFHiOhJQLYIbBIQguBtjron3CzG6kbWs9WjUMQvTfGxqiD1QulVLkYy0__8QOrOKSVyfaCtXEi7xQ2pPYr5AYWiQWauRonIUEabL_97xENm_qlEnKtYyzkQgxv9fUm8rnXhhieUcs1hx0Qg46YkNrRJpzBZIQHCgfuIfP9hB5E64Hob-tJu7zR-1db6ofkzdEvaY7sX6ufyc5YFbSQeUFEkFDQ7T1eDW7RWbF7WiENTab8URh4RAeJkNPMtfDS2BUeQj-1QSb2AjtpWq99he83hk7ygvdGCWy5xwZwSGHBktEY5R1YZim1L9K5Pp1wRwrUGvO5NlPgPFgc8VeN-CXaUYha-jqW6IIUPMDuGyMFoDJ44_LBKTfVnKOXxlv9Av50lJnYZR09u5y1UpyVwgQ4Kk0gA5IIGGkxm9D-8ULLyZP17SQvlEq5vGPfgiX_j6AF0mnH1q2DDzBPigRrplOq5DLUKAulTi