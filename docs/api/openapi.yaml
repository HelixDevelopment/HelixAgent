      responses:
        '200':
          description: Navigation result

  /v1/browser/screenshot:
    post:
      summary: Take screenshot
      operationId: browserScreenshot
      tags:
        - Browser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                selector:
                  type: string
                full_page:
                  type: boolean
      responses:
        '200':
          description: Screenshot data

  /v1/skills:
    get:
      summary: List skills
      operationId: listSkills
      tags:
        - Skills
      responses:
        '200':
          description: Skill list

  /v1/skills/categories:
    get:
      summary: List skill categories
      operationId: listSkillCategories
      tags:
        - Skills
      responses:
        '200':
          description: Categories

  /v1/skills/match:
    post:
      summary: Match skills to query
      operationId: matchSkills
      tags:
        - Skills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                limit:
                  type: integer
      responses:
        '200':
          description: Matched skills

  /v1/qa/sessions:
    post:
      summary: Start QA session
      description: Start an autonomous QA session across platforms
      operationId: startQASession
      tags:
        - QA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_root
              properties:
                project_root:
                  type: string
                platforms:
                  type: array
                  items:
                    type: string
                web_url:
                  type: string
                output_dir:
                  type: string
      responses:
        '200':
          description: QA session result

  /v1/qa/findings:
    get:
      summary: List QA findings
      operationId: listFindings
      tags:
        - QA
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, fixed, verified]
      responses:
        '200':
          description: List of findings

  /v1/qa/platforms:
    get:
      summary: List QA platforms
      operationId: listPlatforms
      tags:
        - QA
      responses:
        '200':
          description: Supported platforms

  /v1/features:
    get:
      summary: Get enabled features
      operationId: getFeatures
      tags:
        - Features
      security: []
      responses:
        '200':
          description: Feature flags

  /v1/features/available:
    get:
      summary: Get all available features
      operationId: getAvailableFeatures
      tags:
        - Features
      security: []
      responses:
        '200':
          description: All features

  /v1/features/agents:
    get:
      summary: Get agent capabilities
      operationId: getAgentCapabilities
      tags:
        - Features
      security: []
      responses:
        '200':
          description: Agent feature matrix

  /v1/graphql:
    post:
      summary: GraphQL endpoint
      description: Feature-flagged GraphQL endpoint (requires GRAPHQL_ENABLED=true)
      operationId: graphql
      tags:
        - GraphQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                variables:
                  type: object
      responses:
        '200':
          description: GraphQL response

  /v1/monitoring/concurrency:
    get:
      summary: Get concurrency status
      operationId: getConcurrencyStatus
      tags:
        - Monitoring
      responses:
        '200':
          description: Concurrency monitoring data

  /v1/monitoring/concurrency/alerts:
    get:
      summary: Get concurrency alerts
      operationId: getConcurrencyAlerts
      tags:
        - Monitoring
      responses:
        '200':
          description: Alert statistics

  /v1/startup/verification:
    get:
      summary: Get startup verification results
      operationId: getStartupVerification
      tags:
        - Monitoring
      security: []
      responses:
        '200':
          description: Startup verification status

  /v1/tasks:
    post:
      summary: Create background task
      operationId: createTask
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                command:
                  type: string
                working_dir:
                  type: string
                priority:
                  type: string
      responses:
        '201':
          description: Task created
    get:
      summary: List tasks
      operationId: listTasks
      tags:
        - Tasks
      responses:
        '200':
          description: Task list

  /v1/tasks/{id}:
    get:
      summary: Get task details
      operationId: getTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
    delete:
      summary: Delete task
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted

  /v1/tasks/{id}/cancel:
    post:
      summary: Cancel task
      operationId: cancelTask
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task cancelled

  /v1/webhooks:
    post:
      summary: Register webhook
      operationId: registerWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook registered
    get:
      summary: List webhooks
      operationId: listWebhooks
      tags:
        - Webhooks
      responses:
        '200':
          description: Webhook list

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

  schemas:
    EnhancedHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        providers:
          type: object
          properties:
            total:
              type: integer
            healthy:
              type: integer
            unhealthy:
              type: integer
        timestamp:
          type: integer

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    ModelsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    Model:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        provider:
          type: string
        created:
          type: integer
        owned_by:
          type: string

    ProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        count:
          type: integer

    Provider:
      type: object
      properties:
        name:
          type: string
        supported_models:
          type: array
          items:
            type: string
        supported_features:
          type: array
          items:
            type: string
        supports_streaming:
          type: boolean
        supports_function_calling:
          type: boolean
        supports_vision:
          type: boolean
        metadata:
          type: object
          additionalProperties: true

    ProviderHealthResponse:
      type: object
      properties:
        provider:
          type: string
        healthy:
          type: boolean
        error:
          type: string
        circuit_breaker:
          type: object
          properties:
            state:
              type: string
              enum: [closed, open, half_open]
            failure_count:
              type: integer
            last_failure:
              type: string
              format: date-time

    CompletionRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: The prompt to complete
        model:
          type: string
          description: Model to use
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 1000
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1.0
        stop:
          type: array
          items:
            type: string
        memory_enhanced:
          type: boolean
          default: false

    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              text:
                type: string
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/Usage'

    ChatCompletionRequest:
      type: object
      required:
        - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stream:
          type: boolean
          default: false

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, function, tool]
        content:
          type: string
        name:
          type: string
        tool_calls:
          type: array
          items:
            type: object

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/Usage'

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    EnsembleCompletionRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer
        ensemble_config:
          $ref: '#/components/schemas/EnsembleConfig'
        memory_enhanced:
          type: boolean

    EnsembleConfig:
      type: object
      properties:
        strategy:
          type: string
          enum: [confidence_weighted, majority_vote, best_of_n, consensus]
          default: confidence_weighted
        min_providers:
          type: integer
          minimum: 1
          default: 2
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        fallback_to_best:
          type: boolean
          default: true
        timeout:
          type: integer
          description: Timeout in seconds
          default: 30
        preferred_providers:
          type: array
          items:
            type: string

    EnsembleCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: ensemble.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/Usage'
        ensemble:
          type: object
          properties:
            voting_method:
              type: string
            responses_count:
              type: integer
            scores:
              type: object
              additionalProperties:
                type: number
            metadata:
              type: object
            selected_provider:
              type: string
            selection_score:
              type: number

    GraphVisualization:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object
        layout:
          type: object

    DatasetsResponse:
      type: object
      properties:
        datasets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              created_at:
                type: string
                format: date-time

    ModelMetadataListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelMetadata'
        count:
          type: integer

    ModelMetadata:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        capabilities:
          type: array
          items:
            type: string
        context_length:
          type: integer
        pricing:
          type: object
          properties:
            input:
              type: number
            output:
              type: number
        last_updated:
          type: string
          format: date-time

    ModelBenchmarks:
      type: object
      properties:
        model_id:
          type: string
        benchmarks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              score:
                type: number
              date:
                type: string
                format: date-time

    ModelComparison:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelMetadata'
        comparison:
          type: object
          additionalProperties: true

    AllProviderHealthResponse:
      type: object
      properties:
        provider_health:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: integer

    RefreshStatus:
      type: object
      properties:
        status:
          type: string
          enum: [pending, running, completed, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        models_updated:
          type: integer
        errors:
          type: array
          items:
            type: string

    DebateRequest:
      type: object
      required:
        - debateId
        - topic
        - participants
        - maxRounds
        - timeout
      properties:
        debateId:
          type: string
          description: Unique identifier for the debate
          example: "debate-123"
        topic:
          type: string
          description: The debate topic or question
          example: "Should AI be regulated?"
        participants:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/Participant'
        maxRounds:
          type: integer
          description: Maximum number of debate rounds
          minimum: 1
          maximum: 10
          example: 3
        timeout:
          type: integer
          description: Total timeout in seconds
          minimum: 60
          maximum: 3600
          example: 300
        strategy:
          type: string
          description: Debate strategy to use
          enum: [structured, free_form, round_robin, socratic, adversarial]
          default: "structured"
        enableCognee:
          type: boolean
          description: Enable Cognee AI enhancement
          default: false
        metadata:
          type: object
          description: Additional metadata
          additionalProperties: true

    Participant:
      type: object
      required:
        - participantId
        - name
        - role
        - llmProvider
        - llmModel
      properties:
        participantId:
          type: string
          description: Unique identifier for the participant
          example: "participant-1"
        name:
          type: string
          description: Participant name
          example: "Alice"
        role:
          type: string
          description: Participant role in the debate
          enum: [proponent, opponent, neutral, moderator]
          example: "proponent"
        llmProvider:
          type: string
          description: LLM provider to use
          enum: [claude, deepseek, gemini, qwen, zai, ollama, openrouter]
          example: "claude"
        llmModel:
          type: string
          description: Specific model to use
          example: "claude-3-opus-20240229"
        maxRounds:
          type: integer
          description: Maximum rounds for this participant
          minimum: 1
          maximum: 10
          example: 3
        timeout:
          type: integer
          description: Timeout for this participant in seconds
          minimum: 30
          maximum: 600
          example: 120
        weight:
          type: number
          description: Voting weight for this participant
          minimum: 0.1
          maximum: 5.0
          example: 1.0

    DebateResponse:
      type: object
      properties:
        debateId:
          type: string
          description: Unique identifier for the created debate
        status:
          type: string
          description: Current status of the debate
          enum: [created, running, completed, failed]
        startTime:
          type: string
          format: date-time
          description: When the debate was started
        estimatedEndTime:
          type: string
          format: date-time
          description: Estimated completion time
        message:
          type: string
          description: Status message

    DebateDetails:
      type: object
      properties:
        debateId:
          type: string
        topic:
          type: string
        status:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in seconds
        totalRounds:
          type: integer
        currentRound:
          type: integer
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantDetails'
        consensus:
          $ref: '#/components/schemas/ConsensusResult'
        qualityScore:
          type: number
          minimum: 0
          maximum: 1
        success:
          type: boolean
        errorMessage:
          type: string

    ParticipantDetails:
      type: object
      properties:
        participantId:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        currentResponse:
          type: string
        responseTime:
          type: integer
        error:
          type: string

    ConsensusResult:
      type: object
      properties:
        achieved:
          type: boolean
        confidence:
          type: number
        agreementLevel:
          type: number
        finalPosition:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        disagreements:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

    # CLI Agent schemas
    Agent:
      type: object
      properties:
        name:
          type: string
          description: Agent name
          example: OpenCode
        language:
          type: string
          description: Implementation language
          example: Go
        configFormat:
          type: string
          description: Configuration format
          enum: [JSON, YAML, TOML, ENV, Proto]
        apiPattern:
          type: string
          description: API pattern used
          enum: [OpenAI, Anthropic, Multi, DeepSeek, Google, AWS, Ollama, Mistral, Qwen]
        protocols:
          type: array
          items:
            type: string
          description: Supported protocols
        tools:
          type: array
          items:
            type: string
          description: Supported tools (21 total)
        features:
          type: array
          items:
            type: string
          description: Key features
        description:
          type: string
          description: Agent description

    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        count:
          type: integer
          description: Total number of agents

    # Provider verification and discovery schemas
    ProviderVerificationResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              verified:
                type: boolean
              score:
                type: number
              status:
                type: string
                enum: [healthy, unhealthy, auth_failed, timeout]
              lastVerified:
                type: string
                format: date-time
        totalProviders:
          type: integer
        verifiedCount:
          type: integer
        timestamp:
          type: string
          format: date-time

    ProviderDiscoveryResponse:
      type: object
      properties:
        discovered:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              envVar:
                type: string
              verified:
                type: boolean
              score:
                type: number
        totalDiscovered:
          type: integer
        oauthProviders:
          type: integer
        apiKeyProviders:
          type: integer

    BestProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              score:
                type: number
              rank:
                type: integer
              isOAuth:
                type: boolean
              models:
                type: array
                items:
                  type: string

    DebateTeamResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            type: object
            properties:
              position:
                type: integer
              role:
                type: string
              primary:
                type: object
                properties:
                  provider:
                    type: string
                  model:
                    type: string
                  score:
                    type: number
              fallbacks:
                type: array
                items:
                  type: object
                  properties:
                    provider:
                      type: string
                    model:
                      type: string
                    score:
                      type: number
        totalLLMs:
          type: integer
          description: Total LLMs in team (15)
        oauthCount:
          type: integer
          description: OAuth providers count
        verifierCount:
          type: integer
          description: LLMsVerifier providers count

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
        timestamp:
          type: string
          format: date-time
          description: When the error occurred

tags:
  - name: Monitoring
    description: Health checks and metrics
  - name: Authentication
    description: User authentication and authorization
  - name: Models
    description: Model listing and metadata
  - name: Providers
    description: LLM provider management
  - name: Completions
    description: Text completion operations
  - name: Chat
    description: Chat completion operations
  - name: Ensemble
    description: Multi-provider ensemble operations
  - name: Cognee
    description: Cognee AI enhancement
  - name: Debates
    description: AI debate operations
  - name: Agents
    description: CLI agent registry and capabilities (18 supported agents with 21 tools)
  - name: Protocols
    description: Protocol SSE endpoints (MCP, ACP, Vision) for CLI agent integration
  - name: Admin
    description: Administrative operations

externalDocs:
  description: Find more information about HelixAgent
  url: https://docs.helixagent.ai
