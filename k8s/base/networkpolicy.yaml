apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helixagent
  labels:
    app: helixagent
spec:
  podSelector:
    matchLabels:
      app: helixagent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: helixagent
      ports:
        - protocol: TCP
          port: 8080
        # gRPC ingress must name the same registry port the Deployment
        # exposes and the Service targets (8112). Left at 9090 this would
        # admit traffic to a port nothing binds while blocking the real one.
        - protocol: TCP
          port: 8112
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 443   # HTTPS (for LLM API calls)
        - protocol: TCP
          port: 53    # DNS
        - protocol: UDP
          port: 53    # DNS
