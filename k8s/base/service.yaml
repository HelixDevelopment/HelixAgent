apiVersion: v1
kind: Service
metadata:
  name: helixagent
  labels:
    app: helixagent
    app.kubernetes.io/name: helixagent
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    # targetPort MUST match the Deployment's gRPC containerPort, which is the
    # port registry's HelixAgentGRPC (8112). Both were 9090 — a port no
    # container binds — so this Service forwarded gRPC traffic into a
    # blackhole. See deployment.yaml for why the endpoint is inert until a
    # grpc-server container is added (HXC-260).
    - name: grpc
      port: 8112
      targetPort: 8112
      protocol: TCP
  selector:
    app: helixagent
---
apiVersion: v1
kind: Service
metadata:
  name: helixagent-headless
  labels:
    app: helixagent
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # Same registry port as the ClusterIP Service above; the headless Service
    # must not disagree with it.
    - name: grpc
      port: 8112
      targetPort: 8112
  selector:
    app: helixagent
