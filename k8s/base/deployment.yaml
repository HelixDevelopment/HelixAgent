apiVersion: apps/v1
kind: Deployment
metadata:
  name: helixagent
  labels:
    app: helixagent
    app.kubernetes.io/name: helixagent
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helixagent
  template:
    metadata:
      labels:
        app: helixagent
    spec:
      containers:
        - name: helixagent
          image: helixagent/helixagent:latest
          ports:
            - containerPort: 8080
              name: http
            # gRPC is published on the port registry's own number
            # (internal/ports: HelixAgentGRPC, core band offset 112). It was
            # 9090, which nothing ever bound.
            #
            # HONEST STATUS (§11.4.6): the image this Deployment runs is built
            # from ./cmd/helixagent, which contains NO gRPC server — that is a
            # separate binary, ./cmd/grpc-server. So this port is correct but
            # currently INERT: no process in this pod listens on it until a
            # grpc-server container is added. It is kept, and kept correct, so
            # that adding one is a one-line change rather than a re-derivation
            # — and so nobody re-invents a third number. Tracked as HXC-260.
            - containerPort: 8112
              name: grpc
          env:
            - name: GIN_MODE
              value: "release"
            # PORT is genuinely read: internal/config/config.go resolves
            # getEnv("PORT", "7061") into cfg.Server.Port, which run() binds.
            # 8080 therefore really is the served port and matches the
            # containerPort and both probes below.
            - name: PORT
              value: "8080"
            # Was GRPC_PORT — a variable NO Go source reads, so it could never
            # move the port and silently defeated anyone who tried. The server
            # resolves ports.HelixAgentGRPC, whose canonical variable is this
            # one. Pinned explicitly rather than left to the registry default
            # so that HELIXAGENT_PORT_PREFIX=9 (which would shift the default
            # to 9112) cannot silently desynchronise it from the containerPort
            # above. internal/ports.TestK8sManifests_GRPCPortMatchesRegistry
            # asserts the two agree with the registry.
            - name: HELIXAGENT_PORT_GRPC
              value: "8112"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: helixagent-secrets
                  key: db-host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: helixagent-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helixagent-secrets
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: helixagent-secrets
                  key: db-name
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: helixagent-secrets
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helixagent-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1000
      serviceAccountName: helixagent
